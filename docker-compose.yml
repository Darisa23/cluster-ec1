services:
  main:
    build: .
    image: cluster-ec1
    container_name: main
    hostname: main
    privileged: true
    networks: [clusternet]
    volumes:
      - ./shared:/home/ec1/shared

  worker1:
    image: cluster-ec1
    container_name: worker1
    hostname: worker1
    privileged: true
    networks: [clusternet]
    depends_on: [main]
    volumes:
      - ./shared:/home/ec1/shared

  worker2:
    image: cluster-ec1
    container_name: worker2
    hostname: worker2
    privileged: true
    networks: [clusternet]
    depends_on: [main]
    volumes:
      - ./shared:/home/ec1/shared

networks:
  clusternet:
    driver: bridge